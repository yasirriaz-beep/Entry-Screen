<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulberg Delivery KM Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --border: #e4ddd1; --ink: #2a2420; --ink-soft: #6f655a;
    --accent: #9c3b2e; --accent-ink: #ffffff; --field-bg: #fcfaf6;
    --ok: #3d7a4f; --ok-bg: #eaf4ec; --warn: #a3650a; --warn-bg: #fdf1dd; --err: #b3261e; --err-bg: #fbeae8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1815; --surface: #262220; --border: #3a342f; --ink: #f1ece4; --ink-soft: #ad9f90;
      --accent: #e0775f; --accent-ink: #1c1815; --field-bg: #201c19;
      --ok: #7cc492; --ok-bg: #1f2c21; --warn: #e4a94a; --warn-bg: #2e2514; --err: #e4867d; --err-bg: #301f1d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1815; --surface: #262220; --border: #3a342f; --ink: #f1ece4; --ink-soft: #ad9f90;
    --accent: #e0775f; --accent-ink: #1c1815; --field-bg: #201c19;
    --ok: #7cc492; --ok-bg: #1f2c21; --warn: #e4a94a; --warn-bg: #2e2514; --err: #e4867d; --err-bg: #301f1d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Libre Franklin', system-ui, sans-serif; padding: 20px 16px 48px; max-width: 680px; margin: 0 auto; }
  h1 { font-family: 'Zilla Slab', Georgia, serif; font-size: 1.5rem; margin: 4px 0 2px; }
  .sub { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  select, input, textarea { width: 100%; min-width: 0; background: var(--field-bg); border: 1px solid var(--border); color: var(--ink); border-radius: 9px; padding: 11px 12px; font-size: 0.95rem; font-family: inherit; }
  button { font-family: inherit; font-weight: 600; font-size: 0.95rem; border: none; border-radius: 10px; padding: 13px 18px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); width: 100%; margin-top: 8px; }
  [hidden] { display: none !important; }
  .step-label { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 10px; }
  .name-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .name-pill { border: 1px solid var(--border); background: var(--field-bg); color: var(--ink); border-radius: 999px; padding: 9px 16px; font-size: 0.9rem; cursor: pointer; }
  .name-pill.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
  .date-row { display: flex; align-items: center; gap: 8px; }
  .date-row input[type="date"] { flex: 1; }
  .date-row button { width: auto; padding: 11px 14px; }
  .rider-row { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--field-bg); }
  .rider-top { display: flex; justify-content: space-between; align-items: baseline; cursor: pointer; gap: 8px; }
  .rider-title { font-weight: 600; }
  .rider-sub { font-size: 0.8rem; color: var(--ink-soft); }
  .rider-detail { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; }
  .row2 > div { flex: 1; min-width: 140px; }
  .pill-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill-ok { background: var(--ok-bg); color: var(--ok); }
  .pill-warn { background: var(--warn-bg); color: var(--warn); }
  .pill-err { background: var(--err-bg); color: var(--err); }
  .banner { border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; margin-top: 10px; line-height: 1.4; }
  .banner-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
  .banner-err { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
  .readout { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type="file"] { padding: 8px; font-size: 0.82rem; }
</style>
</head>
<body>

<h1>Delivery KM Log</h1>
<div class="sub">Forks N Knives — Gulberg · odometer readings for delivery riders, logged per rider per day</div>

<div id="step-name" class="card">
  <div class="step-label">Who are you?</div>
  <div id="name-grid" class="name-grid"></div>
</div>

<div id="panel-main" hidden>

  <div id="lock-banner" class="hint" style="display:none; background:var(--err-bg); color:var(--err); border:1px solid var(--err); border-radius:10px; padding:10px 12px; margin-bottom:14px;"></div>

  <div class="card">
    <div class="step-label">Date</div>
    <div class="date-row">
      <button type="button" class="btn-ghost" id="btn-prev-day" style="margin-top:0;">‹</button>
      <input type="date" id="f-date">
      <button type="button" class="btn-ghost" id="btn-next-day" style="margin-top:0;">›</button>
    </div>
  </div>

  <div class="card">
    <div class="step-label">Riders</div>
    <div id="rider-list"></div>
    <div class="hint" id="rider-list-empty" hidden>No active Delivery department employees found.</div>
  </div>

  <button class="btn-ghost" id="btn-back" type="button">Change Person</button>
</div>

<script>
const SUPABASE_URL = "https://wuezcjvmftbkkwfawhtu.supabase.co";
const ANON_KEY = "sb_publishable_lAVVtSaPN6BhAs7xD3qg5w_Ndf-rhgJ";
const LOCATION_ID = "10000000-0000-0000-0000-000000000005"; // Gulberg
const KM_ROLES = ["director", "shift_manager"];
const ROLE_LABELS = { director: "Director", shift_manager: "Shift Manager" };

let state = { userId: null, userName: null, userRole: null, initials: null, riders: [], logs: {}, lastOdometer: {} };

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,
      "Content-Type": "application/json",
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${text}`);
  }
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("application/json")) return res.json();
  return null;
}

function todayStr() {
  // Gulberg's business day: before 9:00am PKT still counts as the previous
  // calendar day, since the restaurant runs past midnight and does not
  // really "end" until the early-morning close.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Karachi", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hour12: false
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t).value;
  let y = +get("year"), mo = +get("month"), d = +get("day"), hr = +get("hour");
  if (hr === 24) hr = 0;
  const dt = new Date(Date.UTC(y, mo - 1, d));
  if (hr < 9) dt.setUTCDate(dt.getUTCDate() - 1);
  return dt.toISOString().slice(0, 10);
}

function fmtKm(n) { return (Math.round((Number(n) || 0) * 10) / 10).toLocaleString(); }

async function loadNames() {
  try {
    const rows = await sb(`app_users?role=in.(${KM_ROLES.join(",")})&active=eq.true&select=id,name,role&order=name`);
    const grid = document.getElementById("name-grid");
    grid.innerHTML = "";
    rows.forEach(u => {
      const label = ROLE_LABELS[u.role] || u.name;
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "name-pill";
      pill.textContent = label;
      pill.onclick = () => selectUser(u.id, label, pill, u.role);
      grid.appendChild(pill);
    });
    if (rows.length === 0) grid.innerHTML = '<div class="hint">No one with KM-log access found.</div>';
  } catch (e) {
    document.getElementById("name-grid").innerHTML = `<div class="hint" style="color:var(--err)">Couldn't load names: ${e.message}</div>`;
  }
}

function selectUser(id, name, pillEl, role) {
  let initials = "";
  while (!initials) {
    initials = prompt(`Enter your initials, ${name} — this is recorded on every row you log or change.`);
    if (initials === null) return;
    initials = initials.trim().toUpperCase();
  }
  document.querySelectorAll(".name-pill").forEach(p => p.classList.remove("selected"));
  pillEl.classList.add("selected");
  state.userId = id;
  state.userName = name;
  state.userRole = role;
  state.initials = initials;
  setTimeout(() => {
    document.getElementById("step-name").hidden = true;
    document.getElementById("panel-main").hidden = false;
    document.getElementById("f-date").value = todayStr();
    loadRiders().then(loadLogsForDate);
  }, 150);
}

function backToNames() {
  state.userId = null;
  document.querySelectorAll(".name-pill").forEach(p => p.classList.remove("selected"));
  document.getElementById("panel-main").hidden = true;
  document.getElementById("step-name").hidden = false;
}
document.getElementById("btn-back").addEventListener("click", backToNames);

document.getElementById("btn-prev-day").addEventListener("click", () => shiftDate(-1));
document.getElementById("btn-next-day").addEventListener("click", () => shiftDate(1));
function shiftDate(delta) {
  const d = new Date(document.getElementById("f-date").value + "T00:00:00");
  d.setDate(d.getDate() + delta);
  document.getElementById("f-date").value = d.toISOString().slice(0, 10);
  loadLogsForDate();
}
document.getElementById("f-date").addEventListener("change", loadLogsForDate);

async function loadRiders() {
  try {
    state.riders = await sb(`employees?location_id=eq.${LOCATION_ID}&active=eq.true&department=eq.DELIVERY&select=id,name,designation&order=name`);
  } catch (e) { state.riders = []; }
}

async function loadLogsForDate() {
  const date = document.getElementById("f-date").value || todayStr();
  state.logs = {};
  try {
    const rows = await sb(`delivery_km_log?location_id=eq.${LOCATION_ID}&log_date=eq.${date}&select=*`);
    rows.forEach(r => { state.logs[r.employee_id] = r; });
  } catch (e) { /* none yet */ }

  // Pull each rider's most recent prior odometer_end, to suggest today's start reading.
  state.lastOdometer = {};
  try {
    const rows = await sb(`delivery_km_log?location_id=eq.${LOCATION_ID}&log_date=lt.${date}&select=employee_id,odometer_end,log_date&order=log_date.desc`);
    rows.forEach(r => { if (state.lastOdometer[r.employee_id] == null) state.lastOdometer[r.employee_id] = r.odometer_end; });
  } catch (e) { /* none yet */ }

  const isToday = date === todayStr();
  state.locked = !isToday && state.userRole !== "director";
  const banner = document.getElementById("lock-banner");
  if (state.locked) {
    banner.style.display = "block";
    banner.textContent = `This date has closed — only the Director can log or change KM here. (${state.userName || "You"} can still log today, ${todayStr()}.)`;
  } else {
    banner.style.display = "none";
  }

  renderRiderList();
}

function renderRiderList() {
  const list = document.getElementById("rider-list");
  const emptyHint = document.getElementById("rider-list-empty");
  list.innerHTML = "";
  if (!state.riders.length) { emptyHint.hidden = false; return; }
  emptyHint.hidden = true;

  state.riders.forEach(r => {
    const log = state.logs[r.id];
    const row = document.createElement("div");
    row.className = "rider-row";
    const subBits = log
      ? [`KM: ${fmtKm(log.km_driven)}`, `Orders: ${log.orders_delivered}`, log.entered_by_initials ? `by ${log.entered_by_initials}` : null].filter(Boolean).join(" · ")
      : "Not logged yet";
    row.innerHTML = `
      <div class="rider-top">
        <div>
          <span class="rider-title">${r.name}</span>
          <div class="rider-sub">${r.designation || "Rider"} · ${subBits}</div>
        </div>
        ${log ? `<span class="pill-badge ${log.flagged ? "pill-err" : "pill-ok"}">${log.flagged ? "Flagged" : "Logged"}</span>` : `<span class="pill-badge pill-warn">Pending</span>`}
      </div>
      <div class="rider-detail" hidden></div>`;
    const detail = row.querySelector(".rider-detail");
    row.querySelector(".rider-top").addEventListener("click", () => {
      const willOpen = detail.hidden;
      document.querySelectorAll("#rider-list .rider-detail").forEach(d => { if (d !== detail) d.hidden = true; });
      detail.hidden = !detail.hidden;
      if (willOpen) buildDetail(detail, r, log);
    });
    list.appendChild(row);
  });
}

function buildDetail(detail, r, log) {
  const suggestedStart = log ? log.odometer_start : (state.lastOdometer[r.id] != null ? state.lastOdometer[r.id] : "");
  detail.innerHTML = `
    ${log && log.flagged ? `<div class="banner banner-err">Flagged for review: ${log.flag_reason}</div>` : ""}
    <div class="row2 field">
      <div><label>Odometer Start</label><input type="number" class="k-start" step="any" value="${suggestedStart}" ${state.locked ? "disabled" : ""}></div>
      <div><label>Odometer End</label><input type="number" class="k-end" step="any" value="${log ? log.odometer_end : ""}" ${state.locked ? "disabled" : ""}></div>
    </div>
    <div class="field">
      <label>KM Driven (computed)</label>
      <div class="readout k-km-readout">0</div>
    </div>
    <div class="field">
      <label>Orders Delivered</label>
      <input type="number" class="k-orders" step="1" value="${log ? log.orders_delivered : ""}" ${state.locked ? "disabled" : ""}>
    </div>
    <div class="row2 field">
      <div><label>Start Odometer Photo${log && log.start_photo_path ? " (already on file)" : ""}</label><input type="file" accept="image/*" capture="environment" class="k-start-photo" ${state.locked ? "disabled" : ""}></div>
      <div><label>End Odometer Photo${log && log.end_photo_path ? " (already on file)" : ""}</label><input type="file" accept="image/*" capture="environment" class="k-end-photo" ${state.locked ? "disabled" : ""}></div>
    </div>
    <div class="hint" id="k-status" style="margin-bottom:10px;">${log ? "A photo is only required the first time — re-save without picking a new one to keep the one on file." : "Both photos are required the first time you log this rider for the day."}</div>
    <button type="button" class="btn-primary k-save-btn" ${state.locked ? "disabled" : ""}>${state.locked ? "Locked — Director only" : "Save KM Entry"}</button>
  `;

  const recalc = () => {
    const start = parseFloat(detail.querySelector(".k-start").value) || 0;
    const end = parseFloat(detail.querySelector(".k-end").value) || 0;
    const km = Math.max(end - start, 0);
    detail.querySelector(".k-km-readout").textContent = fmtKm(km) + " km";
  };
  detail.querySelector(".k-start").addEventListener("input", recalc);
  detail.querySelector(".k-end").addEventListener("input", recalc);
  recalc();

  detail.querySelector(".k-save-btn").addEventListener("click", () => saveKmEntry(detail, r, log));
}

async function uploadOdometerPhoto(file) {
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${LOCATION_ID}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/odometer/${path}`, {
    method: "POST",
    headers: { "apikey": ANON_KEY, "Authorization": `Bearer ${ANON_KEY}`, "Content-Type": file.type || "image/jpeg" },
    body: file
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error(`Photo upload failed: ${res.status} ${t}`);
  }
  return path;
}

async function saveKmEntry(detail, r, log) {
  if (state.locked) { alert("This date has closed — only the Director can log or change KM here."); return; }
  const date = document.getElementById("f-date").value || todayStr();
  const start = parseFloat(detail.querySelector(".k-start").value);
  const end = parseFloat(detail.querySelector(".k-end").value);
  const orders = parseInt(detail.querySelector(".k-orders").value, 10) || 0;
  if (isNaN(start) || isNaN(end)) { alert("Enter both odometer readings."); return; }
  if (end < start) { alert("End reading can't be less than the start reading."); return; }

  const startFile = detail.querySelector(".k-start-photo").files[0];
  const endFile = detail.querySelector(".k-end-photo").files[0];
  if (!log && (!startFile || !endFile)) {
    alert("Both the start and end odometer photos are required the first time you log this rider for the day.");
    return;
  }

  const btn = detail.querySelector(".k-save-btn");
  const statusEl = detail.querySelector("#k-status");
  btn.disabled = true;
  statusEl.textContent = "Saving…";
  try {
    const [startPath, endPath] = await Promise.all([
      startFile ? uploadOdometerPhoto(startFile) : Promise.resolve(log ? log.start_photo_path : null),
      endFile ? uploadOdometerPhoto(endFile) : Promise.resolve(log ? log.end_photo_path : null)
    ]);

    const payload = {
      employee_id: r.id, location_id: LOCATION_ID, log_date: date,
      odometer_start: start, odometer_end: end, orders_delivered: orders,
      start_photo_path: startPath, end_photo_path: endPath,
      entered_by_user_id: state.userId, entered_by_initials: state.initials
    };

    let saved;
    if (log) {
      saved = await sb(`delivery_km_log?id=eq.${log.id}`, {
        method: "PATCH", headers: { "Prefer": "return=representation" }, body: JSON.stringify(payload)
      });
    } else {
      saved = await sb("delivery_km_log", {
        method: "POST", headers: { "Prefer": "return=representation" }, body: JSON.stringify(payload)
      });
    }
    const row = saved && saved[0];
    state.logs[r.id] = row || payload;
    if (row && row.flagged) {
      statusEl.innerHTML = `<span style="color:var(--err); font-weight:600;">Saved, but flagged for review: ${row.flag_reason}</span>`;
    } else {
      statusEl.textContent = "Saved.";
    }
    renderRiderList();
  } catch (err) {
    alert("Couldn't save: " + (err.message.includes("42501") || err.message.includes("row-level security")
      ? "This date may have just closed. Only the Director can change it now."
      : err.message));
  } finally {
    btn.disabled = false;
  }
}

loadNames();
</script>

</body>
</html>
