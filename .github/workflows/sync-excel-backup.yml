name: Sync Excel backup (Gulberg master workbook)

on:
  schedule:
    # 20:05 UTC ≈ 01:05 AM PKT — 5 minutes after the Google Sheet sync, so the
    # two jobs never race against each other on the same service account token.
    - cron: "5 20 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r excel-sync/scripts/requirements.txt

      - name: Install LibreOffice (for formula recalculation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice

      - name: Pull latest data from Supabase into the workbook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python excel-sync/scripts/sync_excel_backup.py

      - name: Recalculate formulas (LibreOffice)
        run: python excel-sync/scripts/recalc.py excel-sync/out/FNK_Gulberg_Master_Workbook_LIVE.xlsx 120

      - name: Upload to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GDRIVE_TARGET_FILE_NAME: "FNK_Gulberg_Master_Workbook_LIVE.xlsx"
          NOTIFY_EMAIL: ${{ secrets.EXCEL_BACKUP_NOTIFY_EMAIL }}
        run: python excel-sync/scripts/upload_to_drive.py excel-sync/out/FNK_Gulberg_Master_Workbook_LIVE.xlsx

      - name: Upload run artifact (debug copy, 7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: excel-backup
          path: excel-sync/out/FNK_Gulberg_Master_Workbook_LIVE.xlsx
          retention-days: 7
