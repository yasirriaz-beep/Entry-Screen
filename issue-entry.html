<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulberg Issue to Kitchen/Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --border: #e4ddd1; --ink: #2a2420; --ink-soft: #6f655a;
    --accent: #9c3b2e; --accent-ink: #ffffff; --field-bg: #fcfaf6;
    --ok: #3d7a4f; --ok-bg: #eaf4ec; --warn: #a3650a; --warn-bg: #fdf1dd; --err: #b3261e; --err-bg: #fbeae8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1815; --surface: #262220; --border: #3a342f; --ink: #f1ece4; --ink-soft: #ad9f90;
      --accent: #e0775f; --accent-ink: #1c1815; --field-bg: #201c19;
      --ok: #7cc492; --ok-bg: #1f2c21; --warn: #e4a94a; --warn-bg: #2e2514; --err: #e4867d; --err-bg: #301f1d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1815; --surface: #262220; --border: #3a342f; --ink: #f1ece4; --ink-soft: #ad9f90;
    --accent: #e0775f; --accent-ink: #1c1815; --field-bg: #201c19;
    --ok: #7cc492; --ok-bg: #1f2c21; --warn: #e4a94a; --warn-bg: #2e2514; --err: #e4867d; --err-bg: #301f1d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Libre Franklin', system-ui, sans-serif; padding: 20px 16px 48px; max-width: 640px; margin: 0 auto; }
  h1 { font-family: 'Zilla Slab', Georgia, serif; font-size: 1.5rem; margin: 4px 0 2px; }
  .sub { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  select, input, textarea { width: 100%; min-width: 0; background: var(--field-bg); border: 1px solid var(--border); color: var(--ink); border-radius: 9px; padding: 11px 12px; font-size: 0.95rem; font-family: inherit; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; }
  .row2 > div { flex: 1; min-width: 140px; }
  button { font-family: inherit; font-weight: 600; font-size: 0.95rem; border: none; border-radius: 10px; padding: 13px 18px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); width: 100%; margin-top: 8px; }
  [hidden] { display: none !important; }
  .step-label { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 10px; }
  .name-grid, .dest-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .name-pill, .dest-pill { border: 1px solid var(--border); background: var(--field-bg); color: var(--ink); border-radius: 999px; padding: 9px 16px; font-size: 0.9rem; cursor: pointer; }
  .name-pill.selected, .dest-pill.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner { border-radius: 10px; padding: 12px 14px; font-size: 0.88rem; margin-bottom: 14px; line-height: 1.4; }
  .banner-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
  .banner-err { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
  .banner-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
  .banner ul { margin: 6px 0 0 18px; padding: 0; }
  .ack-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 0.85rem; }
  .ack-row input { width: auto; margin-top: 2px; }
  .amount-display { font-family: 'Zilla Slab', Georgia, serif; font-size: 1.4rem; font-weight: 600; }
  .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
  .item-results { margin-top: 6px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; max-height: 240px; overflow-y: auto; }
  .item-result-row { padding: 11px 12px; font-size: 0.9rem; cursor: pointer; border-bottom: 1px solid var(--border); background: var(--field-bg); }
  .item-result-row:last-child { border-bottom: none; }
  .item-result-row:hover, .item-result-row:active { background: var(--border); }
  .item-result-row.empty { cursor: default; color: var(--ink-soft); }
  .item-result-row.empty:hover { background: var(--field-bg); }
  .po-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--field-bg); }
  .po-card .po-title { font-weight: 600; }
  .po-card .po-sub { font-size: 0.8rem; color: var(--ink-soft); margin-top: 2px; }
  .success-wrap { text-align: center; padding: 48px 16px; }
  .success-wrap .check { font-size: 2.6rem; }
</style>
</head>
<body>

<h1>Issue to Kitchen / Floor</h1>
<div class="sub">Forks N Knives — Gulberg store room movement</div>

<div id="task-banner-wrap"></div>

<div id="step-name" class="card">
  <div class="step-label">Who's issuing this?</div>
  <div id="name-grid" class="name-grid"></div>
</div>

<div id="step-form" hidden>
  <div class="card">
    <div class="field">
      <label>Date</label>
      <input type="date" id="f-date">
    </div>

    <div class="field">
      <label>Item Code / Name</label>
      <input type="text" id="f-item-search" placeholder="Start typing an item name..." autocomplete="off">
      <input type="hidden" id="f-item-select">
      <div id="f-item-results" class="item-results" hidden></div>
      <div class="hint" id="item-hint"></div>
    </div>

    <div class="field">
      <label>Issued To</label>
      <div class="dest-grid">
        <button type="button" class="dest-pill" data-val="BOH">Kitchen (BOH)</button>
        <button type="button" class="dest-pill" data-val="FOH">Front Floor (FOH)</button>
        <button type="button" class="dest-pill" data-val="DEL">Delivery (DEL)</button>
      </div>
    </div>

    <div class="row2 field">
      <div>
        <label>Qty</label>
        <input type="number" id="f-qty" step="any" placeholder="0">
      </div>
      <div>
        <label>Rate (PKR)</label>
        <input type="number" id="f-rate" step="any" placeholder="0">
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:4px;">
      <span class="hint">Value</span>
      <span class="amount-display" id="total-display">PKR 0</span>
    </div>
  </div>

  <div id="ai-banner-wrap"></div>

  <button class="btn-primary" id="btn-check" type="button">Check &amp; Save</button>
  <button class="btn-ghost" id="btn-back" type="button">Back</button>

  <div class="card" style="margin-top:16px;">
    <div class="step-label">Issued Today</div>
    <div id="today-list"></div>
    <div class="hint" id="today-empty" hidden>Nothing issued yet today.</div>
  </div>
</div>

<div id="step-success" class="card success-wrap" hidden>
  <div class="check">✓</div>
  <div style="margin-top:8px; font-weight:600;">Issue logged</div>
  <div class="hint" style="margin-top:4px;">Entry cleared. Ready for the next one.</div>
  <button class="btn-primary" id="btn-another" type="button" style="margin-top:18px;">Log Another</button>
</div>

<script>
const SUPABASE_URL = "https://wuezcjvmftbkkwfawhtu.supabase.co";
const ANON_KEY = "sb_publishable_lAVVtSaPN6BhAs7xD3qg5w_Ndf-rhgJ";
const LOCATION_ID = "10000000-0000-0000-0000-000000000005"; // Gulberg
const ISSUER_ROLES = ["store_man", "shift_manager", "director"];

const ROLE_LABELS = {
  cash_custodian: "Cash Custodian",
  auditor: "Auditor",
  director: "Director",
  shift_manager: "Shift Manager",
  store_man: "Store Man"
};

let state = { userId: null, userName: null, products: [], destination: null, pendingFlags: [], acknowledged: false };

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,
      "Content-Type": "application/json",
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${text}`);
  }
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("application/json")) return res.json();
  return null;
}

function todayStr() { return new Date().toISOString().slice(0, 10); }

async function loadNames() {
  try {
    const rows = await sb(`app_users?location_id=eq.${LOCATION_ID}&role=in.(${ISSUER_ROLES.join(",")})&active=eq.true&select=id,name,role&order=name`);
    const grid = document.getElementById("name-grid");
    grid.innerHTML = "";
    rows.forEach(u => {
      const label = ROLE_LABELS[u.role] || u.name;
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "name-pill";
      pill.textContent = label;
      pill.onclick = () => selectUser(u.id, label, pill);
      grid.appendChild(pill);
    });
    if (rows.length === 0) {
      grid.innerHTML = '<div class="hint">No authorized issuers found for Gulberg.</div>';
    }
  } catch (e) {
    document.getElementById("name-grid").innerHTML = `<div class="hint" style="color:var(--err)">Couldn't load names: ${e.message}</div>`;
  }
}

function selectUser(id, name, pillEl) {
  document.querySelectorAll(".name-pill").forEach(p => p.classList.remove("selected"));
  pillEl.classList.add("selected");
  state.userId = id;
  state.userName = name;
  setTimeout(() => {
    document.getElementById("step-name").hidden = true;
    document.getElementById("step-form").hidden = false;
    document.getElementById("f-date").value = todayStr();
    loadTodayList();
  }, 150);
}

async function loadTodayList() {
  const list = document.getElementById("today-list");
  const emptyHint = document.getElementById("today-empty");
  try {
    const rows = await sb(`daily_issues?location_id=eq.${LOCATION_ID}&issue_date=eq.${todayStr()}&select=id,qty,issued_to,amount,created_at,products(name,unit)&order=created_at.desc`);
    list.innerHTML = "";
    if (!rows.length) { emptyHint.hidden = false; return; }
    emptyHint.hidden = true;
    rows.forEach(r => {
      const row = document.createElement("div");
      row.className = "po-card";
      row.innerHTML = `
        <div class="po-title">${r.products?.name || "Item"}</div>
        <div class="po-sub">${r.qty} ${r.products?.unit || ""} → ${r.issued_to} · PKR ${Math.round(r.amount || 0).toLocaleString()} · ${new Date(r.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>`;
      list.appendChild(row);
    });
  } catch (e) { emptyHint.hidden = false; }
}

async function loadProducts() {
  try {
    state.products = await sb(`products?active=eq.true&select=id,code,name,unit,current_rate&order=name`);
  } catch (e) { state.products = []; }
}

function populateItemResults(filterText) {
  const wrap = document.getElementById("f-item-results");
  const ft = (filterText || "").trim().toUpperCase();
  // Typing anything invalidates a previous selection until a new one is made.
  document.getElementById("f-item-select").value = "";
  document.getElementById("item-hint").textContent = "";
  if (!ft) { wrap.innerHTML = ""; wrap.hidden = true; return; }
  const matches = state.products.filter(p => p.name.toUpperCase().includes(ft) || (p.code || "").toUpperCase().includes(ft));
  if (!matches.length) {
    wrap.innerHTML = `<div class="item-result-row empty">No matching item</div>`;
    wrap.hidden = false;
    return;
  }
  wrap.innerHTML = matches.slice(0, 20).map(p =>
    `<div class="item-result-row" data-id="${p.id}">${p.code || "?"} — ${p.name}</div>`
  ).join("");
  wrap.hidden = false;
}

function selectItem(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  document.getElementById("f-item-select").value = id;
  document.getElementById("f-item-search").value = `${p.code || "?"} — ${p.name}`;
  document.getElementById("f-item-results").innerHTML = "";
  document.getElementById("f-item-results").hidden = true;
  document.getElementById("f-rate").value = p.current_rate || "";
  document.getElementById("item-hint").textContent = `Unit: ${p.unit || "—"} · Last rate on file: PKR ${p.current_rate || 0}`;
  resetAiBanner();
  recalcAmount();
}

function recalcAmount() {
  const qty = parseFloat(document.getElementById("f-qty").value) || 0;
  const rate = parseFloat(document.getElementById("f-rate").value) || 0;
  const amount = qty * rate;
  document.getElementById("total-display").textContent = "PKR " + amount.toLocaleString("en-PK", { maximumFractionDigits: 2 });
  return amount;
}

function resetAiBanner() {
  document.getElementById("ai-banner-wrap").innerHTML = "";
  state.pendingFlags = [];
  state.acknowledged = false;
  setSaveLabel("Check & Save");
}

function setSaveLabel(label) {
  document.getElementById("btn-check").textContent = label;
}

function renderFlags(reasons) {
  const wrap = document.getElementById("ai-banner-wrap");
  if (!reasons.length) {
    wrap.innerHTML = `<div class="banner banner-ok">No issues found with this entry.</div>`;
    state.pendingFlags = [];
    setSaveLabel("Save Issue");
    return;
  }
  state.pendingFlags = reasons;
  wrap.innerHTML = `
    <div class="banner banner-warn">
      <strong>This entry looks unusual:</strong>
      <ul>${reasons.map(r => `<li>${r}</li>`).join("")}</ul>
      <label class="ack-row">
        <input type="checkbox" id="ack-box">
        <span>I've checked this and the entry is correct — save it anyway.</span>
      </label>
    </div>`;
  document.getElementById("ack-box").addEventListener("change", (e) => {
    state.acknowledged = e.target.checked;
    setSaveLabel(state.acknowledged ? "Save Anyway" : "Fix & Re-check");
  });
  setSaveLabel("Fix & Re-check");
}

async function runCheckAndMaybeSave() {
  const itemSel = document.getElementById("f-item-select");
  const qty = recalcAmount() > -1 ? (parseFloat(document.getElementById("f-qty").value) || 0) : 0;
  const date = document.getElementById("f-date").value;

  if (!date) return alert("Pick a date.");
  if (!itemSel.value) return alert("Pick an item.");
  if (!state.destination) return alert("Pick where this is being issued to.");
  if (!qty || qty <= 0) return alert("Enter a quantity greater than zero.");

  if (state.pendingFlags.length > 0 && !state.acknowledged) {
    alert("Please review the warning above, then tick the acknowledgement box or adjust the entry.");
    return;
  }
  if (state.pendingFlags.length > 0 && state.acknowledged) {
    await saveIssue();
    return;
  }

  document.getElementById("btn-check").disabled = true;
  try {
    const result = await sb(`rpc/check_issue_entry`, {
      method: "POST",
      body: JSON.stringify({
        p_location_id: LOCATION_ID,
        p_product_id: itemSel.value,
        p_qty: qty,
        p_issue_date: date
      })
    });
    const reasons = (result || []).map(r => r.reason);
    if (reasons.length === 0) {
      await saveIssue();
    } else {
      renderFlags(reasons);
    }
  } catch (e) {
    document.getElementById("ai-banner-wrap").innerHTML =
      `<div class="banner banner-err">Check failed (${e.message}). You can still save, but it hasn't been pattern-checked.</div>`;
  } finally {
    document.getElementById("btn-check").disabled = false;
  }
}

async function saveIssue() {
  const itemSel = document.getElementById("f-item-select");
  const p = state.products.find(x => x.id === itemSel.value);
  const qty = parseFloat(document.getElementById("f-qty").value) || 0;
  const rate = parseFloat(document.getElementById("f-rate").value) || 0;
  const date = document.getElementById("f-date").value;

  const payload = {
    location_id: LOCATION_ID,
    product_id: itemSel.value,
    issue_date: date,
    issued_to: state.destination,
    qty: qty,
    rate: rate,
    amount: qty * rate,
    entered_by_user_id: state.userId
  };

  try {
    document.getElementById("btn-check").disabled = true;
    await sb("daily_issues", {
      method: "POST",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify(payload)
    });
    showSuccess();
  } catch (e) {
    alert("Couldn't save: " + e.message);
  } finally {
    document.getElementById("btn-check").disabled = false;
  }
}

function showSuccess() {
  document.getElementById("step-form").hidden = true;
  document.getElementById("step-success").hidden = false;
}

function resetForm() {
  document.getElementById("f-date").value = todayStr();
  document.getElementById("f-item-search").value = "";
  document.getElementById("f-item-select").value = "";
  document.getElementById("f-item-results").innerHTML = "";
  document.getElementById("f-item-results").hidden = true;
  document.getElementById("f-qty").value = "";
  document.getElementById("f-rate").value = "";
  document.getElementById("item-hint").textContent = "";
  document.querySelectorAll(".dest-pill").forEach(p => p.classList.remove("selected"));
  state.destination = null;
  resetAiBanner();
  recalcAmount();
  document.getElementById("step-success").hidden = true;
  document.getElementById("step-form").hidden = false;
  loadTodayList();
}

document.querySelectorAll(".dest-pill").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".dest-pill").forEach(p => p.classList.remove("selected"));
    btn.classList.add("selected");
    state.destination = btn.dataset.val;
  });
});

document.getElementById("f-qty").addEventListener("input", () => { resetAiBanner(); recalcAmount(); });
document.getElementById("f-rate").addEventListener("input", recalcAmount);
document.getElementById("f-item-search").addEventListener("input", (e) => populateItemResults(e.target.value));
document.getElementById("f-item-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const rows = document.querySelectorAll("#f-item-results .item-result-row[data-id]");
    if (rows.length === 1) selectItem(rows[0].dataset.id);
  }
});
document.getElementById("f-item-search").addEventListener("focus", () => {
  const search = document.getElementById("f-item-search");
  if (search.value && !document.getElementById("f-item-select").value) {
    populateItemResults(search.value);
  }
});
document.getElementById("f-item-search").addEventListener("blur", () => {
  setTimeout(() => { document.getElementById("f-item-results").hidden = true; }, 150);
});
document.getElementById("f-item-results").addEventListener("mousedown", (e) => {
  // mousedown (not click) so it fires before the search input's blur handler hides the list
  const row = e.target.closest(".item-result-row[data-id]");
  if (row) selectItem(row.dataset.id);
});
document.getElementById("btn-check").addEventListener("click", runCheckAndMaybeSave);
document.getElementById("btn-back").addEventListener("click", () => {
  document.getElementById("step-form").hidden = true;
  document.getElementById("step-name").hidden = false;
});
document.getElementById("btn-another").addEventListener("click", resetForm);

// Store Man's own pending-tasks banner — same checklist the Owner Dashboard surfaces,
// scoped to this location, since there's no per-person login here.
async function loadTaskBanner(){
  const wrap = document.getElementById("task-banner-wrap");
  try {
    const rows = await sb(`audit_alerts?location_id=eq.${LOCATION_ID}&status=eq.open&alert_type=eq.task_issuance_missing&select=title&order=title.asc`);
    if (!rows.length) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = `<div class="banner banner-err"><strong>Pending for Store Man:</strong> ${rows.map(r => r.title.replace("No issuance logged - ", "")).join(", ")} — nothing logged on this screen for that date.</div>`;
  } catch (e) { wrap.innerHTML = ""; }
}

loadNames();
loadProducts();
loadTaskBanner();
</script>

</body>
</html>
