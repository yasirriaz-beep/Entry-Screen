<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulberg Sales Entry</title>
<style>
/* Layout: login card, then Morning / Evening / Totals shown side by side (desktop) or
   stacked Morning -> Evening -> Totals (mobile). Each shift is its own self-contained
   card with its own Save / Close Shift / Director Unlock controls. */
:root{
  --bg:#17211c; --surface:#1f2b24; --surface-2:#263429; --border:#35473b;
  --fg:#eef3ee; --fg-muted:#9db3a4; --accent:#d88a3f; --accent-fg:#241505;
  --success:#5fae6e; --success-bg:#1d3324; --danger:#d9705f; --danger-bg:#3a2320;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#efece2; --border:#ddd6c4;
    --fg:#1d2420; --fg-muted:#5c6a60; --accent:#b5652a; --accent-fg:#fff8ef;
    --success:#2f7a42; --success-bg:#e4f2e6; --danger:#b4402f; --danger-bg:#fbe8e4;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f4ee; --surface:#ffffff; --surface-2:#efece2; --border:#ddd6c4;
  --fg:#1d2420; --fg-muted:#5c6a60; --accent:#b5652a; --accent-fg:#fff8ef;
  --success:#2f7a42; --success-bg:#e4f2e6; --danger:#b4402f; --danger-bg:#fbe8e4;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#17211c; --surface:#1f2b24; --surface-2:#263429; --border:#35473b;
  --fg:#eef3ee; --fg-muted:#9db3a4; --accent:#d88a3f; --accent-fg:#241505;
  --success:#5fae6e; --success-bg:#1d3324; --danger:#d9705f; --danger-bg:#3a2320;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Libre Franklin',system-ui,sans-serif;padding-inline:16px;padding-block:20px 60px;max-width:1240px;margin:0 auto}
h1,h2,.display{font-family:'Zilla Slab',Georgia,serif}
h1{font-size:1.5rem;margin:0 0 2px;text-wrap:balance}
h2{font-size:1.15rem;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-size:.8rem;color:var(--fg-muted)}
select,input[type=number],input[type=date],input[type=text],input[type=password]{
  background:var(--surface-2);border:1px solid var(--border);color:var(--fg);
  border-radius:9px;padding:11px 12px;font-size:1rem;font-family:inherit;width:100%;
}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
input:disabled{opacity:.6}
.login-error{font-size:.82rem;color:var(--danger,#d33)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.channel{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.channel:first-of-type{border-top:none;padding-top:0;margin-top:0}
.channel h3{font-size:.95rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
button.primary{
  width:100%;background:var(--accent);color:var(--accent-fg);border:none;border-radius:10px;
  padding:14px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;
}
button.primary:disabled{opacity:.5;cursor:default}
button.ghost{background:none;border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:9px 14px;font-family:inherit;cursor:pointer;font-size:.85rem}
button.ghost:disabled{opacity:.5;cursor:default}
.num{font-family:'Zilla Slab',Georgia,serif;font-variant-numeric:tabular-nums}
.lbl{font-size:.7rem;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em}
.banner{border-radius:10px;padding:12px 14px;font-size:.88rem;margin-bottom:14px;display:none}
.banner.show{display:block}
.banner.success{background:var(--success-bg);color:var(--success)}
.banner.danger{background:var(--danger-bg);color:var(--danger)}
[hidden]{display:none!important}
.who-row{display:flex;gap:10px;align-items:flex-end}
.who-row .field{flex:1}
.muted{color:var(--fg-muted);font-size:.82rem}
.status-badge{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}
.status-badge.draft{background:var(--surface-2);color:var(--fg-muted)}
.status-badge.closed{background:var(--success-bg);color:var(--success)}
.recon-box{margin-top:12px;background:var(--surface-2);border-radius:10px;padding:12px}
.shift-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:980px){
  .shift-grid{grid-template-columns:1fr 1fr 320px}
}
.totals-panel{position:sticky;top:16px}
@media (max-width:979px){
  .totals-panel{position:static}
}
</style>
</head>
<body>

<div class="eyebrow">Forks N Knives &middot; Gulberg</div>
<h1>Shift Sales &amp; Cash Entry</h1>
<p class="muted" style="margin:4px 0 18px">Morning and Evening side by side &mdash; sales by channel, then each shift's till cash reconciliation.</p>

<div id="banner" class="banner"></div>
<div id="taskBanner" class="banner"></div>

<div class="card" id="whoCard" style="max-width:480px;margin-left:auto;margin-right:auto">
  <div class="who-row">
    <div class="field">
      <label for="loginName">Entered by</label>
      <input type="text" id="loginName" placeholder="Code" autocomplete="username" maxlength="2" style="text-transform:uppercase" autocapitalize="characters" pattern="[A-Za-z]{2}">
    </div>
    <div class="field" style="flex:0 0 150px">
      <label for="dateInput">Date</label>
      <input type="date" id="dateInput">
    </div>
  </div>
  <div class="field" style="margin-top:12px">
    <label for="loginPin">PIN</label>
    <input type="password" id="loginPin" placeholder="PIN" autocomplete="current-password" inputmode="numeric">
  </div>
  <div class="login-error" id="login-error" hidden style="margin-top:8px">Incorrect code or PIN.</div>
  <button class="primary" id="continueBtn" style="margin-top:14px" disabled>Continue</button>
</div>

<div id="shiftsContainer" class="shift-grid" hidden>
  <div class="card" id="panel_morning"></div>
  <div class="card" id="panel_evening"></div>
  <div class="card totals-panel" id="panel_totals"></div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap">
<script src="session.js"></script>
<script>
const SUPABASE_URL = "https://wuezcjvmftbkkwfawhtu.supabase.co";
const ANON_KEY = "sb_publishable_lAVVtSaPN6BhAs7xD3qg5w_Ndf-rhgJ";
const LOCATION_NAME_HINT = "Gulberg";

const headers = {
  "apikey": ANON_KEY,
  "Authorization": "Bearer " + ANON_KEY,
  "Content-Type": "application/json",
};
const PAGE_KEY = "sales_entry";
// The till always starts — and is expected to end — at this standard float. It is NOT carried
// forward from whatever the previous shift's physical count happened to be (that led to small
// miscounts silently compounding shift after shift). Any gap between this and what the shift
// manager physically counts is a flagged variance for that shift alone, 2026-10-13.
const STANDARD_TILL_FLOAT = 40000;

const SHIFT_LABELS = { morning: "Morning", evening: "Evening" };
const SHIFT_TIME = { morning: "9:00 AM &ndash; 6:00 PM", evening: "6:00 PM &ndash; 3:00 AM" };
const FIELD_BASES = ["diCovers","diAmount","taCovers","taAmount","dlCovers","dlAmount","tpCovers","tpAmount","fpCovers","fpAmount","bakeryAmount","cardAmount"];

let locationId = null;
let resolvedUserId = null;   // the real app_users.id, set only after the chosen manager's PIN verifies
let resolvedManagerId = null;

// Per-shift state. Morning and Evening are tracked completely independently — each has its
// own opening float, its own real cash-expense total, its own "has the custodian field been
// hand-edited" flag, and its own lock status. Added 2026-10-13 for the side-by-side redesign.
const state = {
  morning: { openingCashTill: STANDARD_TILL_FLOAT, tillCashExpenses: 0, custodianTouched: false, existingEntryId: null, status: "draft" },
  evening: { openingCashTill: STANDARD_TILL_FLOAT, tillCashExpenses: 0, custodianTouched: false, existingEntryId: null, status: "draft" },
};

async function sbRpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST", headers, body: JSON.stringify(body || {})
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    let msg = text;
    try { msg = JSON.parse(text).message || text; } catch (e) { /* use raw text */ }
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : null;
}

function showBanner(msg, kind){
  const b = document.getElementById("banner");
  b.textContent = msg;
  b.className = "banner show " + kind;
}
function hideBanner(){
  document.getElementById("banner").className = "banner";
}

// --- per-shift field helpers (every field id is "<base>_<shift>") ---
function fid(base, shift){ return base + "_" + shift; }
function nS(base, shift){
  const el = document.getElementById(fid(base, shift));
  const v = el ? el.value : "";
  return v === "" ? 0 : parseFloat(v);
}
function setVal(base, shift, v){
  document.getElementById(fid(base, shift)).value = (v === null || v === undefined) ? "" : v;
}

function panelInnerHTML(shift, label){
  const s = shift;
  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px">
      <h2>${label} Shift</h2>
      <span class="status-badge draft" id="statusBadge_${s}">Draft</span>
    </div>
    <p class="muted" style="margin:0 0 12px">${SHIFT_TIME[s]}</p>
    <div class="muted" id="lockedNote_${s}" style="margin:0 0 12px;color:var(--danger)" hidden></div>

    <div class="channel" style="border-top:none;padding-top:0;margin-top:0">
      <h3><span class="dot"></span>Dine-in</h3>
      <div class="row2">
        <div class="field"><label for="diCovers_${s}">Covers</label><input type="number" id="diCovers_${s}" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="diAmount_${s}">Amount (PKR)</label><input type="number" id="diAmount_${s}" min="0" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>
    <div class="channel">
      <h3><span class="dot"></span>Takeaway</h3>
      <div class="row2">
        <div class="field"><label for="taCovers_${s}">Covers</label><input type="number" id="taCovers_${s}" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="taAmount_${s}">Amount (PKR)</label><input type="number" id="taAmount_${s}" min="0" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>
    <div class="channel">
      <h3><span class="dot"></span>Delivery (own riders)</h3>
      <div class="row2">
        <div class="field"><label for="dlCovers_${s}">Covers</label><input type="number" id="dlCovers_${s}" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="dlAmount_${s}">Amount (PKR)</label><input type="number" id="dlAmount_${s}" min="0" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>
    <div class="channel">
      <h3><span class="dot"></span>Food Panda</h3>
      <div class="row2">
        <div class="field"><label for="fpCovers_${s}">Covers</label><input type="number" id="fpCovers_${s}" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="fpAmount_${s}">Amount (PKR)</label><input type="number" id="fpAmount_${s}" min="0" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>
    <div class="channel">
      <h3><span class="dot"></span>Third Party (Careem / other)</h3>
      <div class="row2">
        <div class="field"><label for="tpCovers_${s}">Covers</label><input type="number" id="tpCovers_${s}" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="tpAmount_${s}">Amount (PKR)</label><input type="number" id="tpAmount_${s}" min="0" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>
    <div class="channel">
      <h3><span class="dot"></span>Bakery</h3>
      <div class="field"><label for="bakeryAmount_${s}">Sale (PKR)</label><input type="number" id="bakeryAmount_${s}" min="0" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="channel">
      <h3><span class="dot"></span>Paid by Card</h3>
      <div class="field">
        <label for="cardAmount_${s}">Card portion already included above (PKR)</label>
        <input type="number" id="cardAmount_${s}" min="0" inputmode="decimal" placeholder="0">
      </div>
      <p class="muted" style="margin:6px 0 0">Doesn't change the total &mdash; just flags how much of it isn't cash in the till. Third Party (Careem/other) is cash in hand and is included in the till recon below.</p>
    </div>

    <div class="recon-box">
      <h3 style="margin:0 0 4px;font-size:.95rem">Till Cash Reconciliation</h3>
      <p class="muted" style="margin:0 0 12px">Standard float is PKR 40,000, start and end. Almost everything below fills in on its own &mdash; you just count the till and enter what's physically there.</p>
      <div class="row2">
        <div class="field">
          <label for="openingCashDisplay_${s}">Opening cash</label>
          <input type="text" id="openingCashDisplay_${s}" value="&mdash;" disabled>
        </div>
        <div class="field">
          <label for="cashSalesDisplay_${s}">Cash sales</label>
          <input type="text" id="cashSalesDisplay_${s}" value="PKR 0" disabled>
        </div>
      </div>
      <div class="field" style="margin-top:10px">
        <label for="tillExpensesDisplay_${s}">Cash expenses this shift (from Daily Expense)</label>
        <input type="text" id="tillExpensesDisplay_${s}" value="PKR 0" disabled>
      </div>

      <div class="field" style="margin-top:12px;background:var(--surface);border-radius:9px;padding:12px">
        <div class="row2">
          <div>
            <label style="margin-bottom:2px">Cash to give custodian</label>
            <div class="num" id="autoHandoverDisplay_${s}" style="font-size:1.1rem">PKR 0</div>
            <p class="muted" style="margin:4px 0 0;font-size:.76rem">Auto: Cash Sales &minus; Cash Expenses</p>
          </div>
          <div class="field" style="margin:0">
            <label for="custodianAmount_${s}">Actual handover</label>
            <input type="number" id="custodianAmount_${s}" inputmode="decimal" placeholder="0">
          </div>
        </div>
        <p class="muted" id="handoverVarianceNote_${s}" style="margin:8px 0 0;font-size:.76rem"></p>
      </div>

      <div class="field" style="margin-top:10px">
        <label for="closingCash_${s}">Actual physical cash present in till &mdash; only field you have to enter</label>
        <input type="number" id="closingCash_${s}" min="0" inputmode="decimal" placeholder="0">
        <p class="muted" id="closingVarianceNote_${s}" style="margin:4px 0 0;font-size:.76rem"></p>
      </div>
    </div>

    <div class="row2" style="margin-top:14px">
      <div><div class="lbl">Covers</div><div class="num" id="sumCovers_${s}" style="font-size:1.2rem">0</div></div>
      <div><div class="lbl">Total sale</div><div class="num" id="sumAmount_${s}" style="font-size:1.2rem">PKR 0</div></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
      <button type="button" class="primary" id="saveBtn_${s}" style="flex:1;min-width:110px">Save</button>
      <button type="button" class="ghost" id="closeBtn_${s}">Close Shift</button>
    </div>
    <button type="button" class="ghost" id="unlockBtn_${s}" hidden style="margin-top:10px;width:100%">Director Unlock</button>
  `;
}

function totalsPanelHTML(){
  return `
    <h2 style="margin:0 0 4px">Whole Day Totals</h2>
    <p class="muted" style="margin:0 0 16px">Morning + Evening combined &mdash; updates live as either shift is edited. For the director: this is the number that matters, not either shift alone.</p>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div><div class="lbl">Total covers</div><div class="num" id="totalCovers" style="font-size:1.3rem">0</div></div>
      <div><div class="lbl">Total sale</div><div class="num" id="totalSale" style="font-size:1.3rem">PKR 0</div></div>
      <div><div class="lbl">Cash sales (both shifts)</div><div class="num" id="totalCashSales" style="font-size:1.1rem">PKR 0</div></div>
      <div><div class="lbl">Cash expenses (both shifts)</div><div class="num" id="totalCashExpenses" style="font-size:1.1rem">PKR 0</div></div>
      <div><div class="lbl">Handed to custodian (both shifts)</div><div class="num" id="totalHandover" style="font-size:1.1rem">PKR 0</div></div>
    </div>
    <div class="muted" id="shiftStatusSummary" style="margin-top:18px;font-size:.82rem;border-top:1px solid var(--border);padding-top:12px"></div>
  `;
}

function buildPanels(){
  document.getElementById("panel_morning").innerHTML = panelInnerHTML("morning", "Morning");
  document.getElementById("panel_evening").innerHTML = panelInnerHTML("evening", "Evening");
  document.getElementById("panel_totals").innerHTML = totalsPanelHTML();
  wireShift("morning");
  wireShift("evening");
}

function wireShift(shift){
  ["diCovers","diAmount","taCovers","taAmount","dlCovers","dlAmount","tpCovers","tpAmount","fpCovers","fpAmount","bakeryAmount"]
    .forEach(base => document.getElementById(fid(base, shift)).addEventListener("input", () => recalcSummary(shift)));
  ["cardAmount","closingCash"]
    .forEach(base => document.getElementById(fid(base, shift)).addEventListener("input", () => { recalcCashRecon(shift); recalcTotals(); }));
  // Typing in the custodian field is what marks it as a manual override — after that, the
  // auto-suggestion stops overwriting it for the rest of this shift.
  document.getElementById(fid("custodianAmount", shift)).addEventListener("input", () => {
    state[shift].custodianTouched = true;
    recalcCashRecon(shift);
    recalcTotals();
  });
  document.getElementById("saveBtn_" + shift).addEventListener("click", () => saveShift(shift, false));
  document.getElementById("closeBtn_" + shift).addEventListener("click", () => saveShift(shift, true));
  document.getElementById("unlockBtn_" + shift).addEventListener("click", () => unlockShift(shift));
}

function recalcSummary(shift){
  const covers = Math.round(nS("diCovers",shift) + nS("taCovers",shift) + nS("dlCovers",shift) + nS("tpCovers",shift) + nS("fpCovers",shift));
  // Bakery Sale Amount is a memo breakdown of items already included in Dine-In/Takeaway/
  // Delivery amounts (confirmed with the owner 2026-10-11) — never added to the total.
  const amount = nS("diAmount",shift) + nS("taAmount",shift) + nS("dlAmount",shift) + nS("tpAmount",shift) + nS("fpAmount",shift);
  document.getElementById("sumCovers_" + shift).textContent = covers.toLocaleString();
  document.getElementById("sumAmount_" + shift).textContent = "PKR " + Math.round(amount).toLocaleString();
  recalcCashRecon(shift);
  recalcTotals();
}

// Cash actually received in the till: the channels that land in hand, minus the card
// portion of them. Third Party (Careem/other) is cash in hand, confirmed 2026-10-09 —
// included here. Food Panda still settles externally, so it's excluded entirely. Bakery
// Sale Amount is a memo breakdown already inside Dine-In/Takeaway/Delivery (confirmed
// 2026-10-11) — it is NOT added again here.
function cashSalesTotal(shift){
  return nS("diAmount",shift) + nS("taAmount",shift) + nS("dlAmount",shift) + nS("tpAmount",shift) - nS("cardAmount",shift);
}

function recalcCashRecon(shift){
  const st = state[shift];
  const cashSales = cashSalesTotal(shift);
  document.getElementById("cashSalesDisplay_" + shift).value = "PKR " + Math.round(cashSales).toLocaleString();
  document.getElementById("tillExpensesDisplay_" + shift).value = "PKR " + Math.round(st.tillCashExpenses).toLocaleString();

  // Auto-generated: what should go to the custodian to keep the till at the 40,000 float.
  const autoHandover = cashSales - st.tillCashExpenses;
  document.getElementById("autoHandoverDisplay_" + shift).textContent = "PKR " + Math.round(autoHandover).toLocaleString();

  // Pre-fills the actual-handover field until the shift manager edits it themselves —
  // after that we leave their number alone (it's a record of what really happened).
  if (!st.custodianTouched) {
    setVal("custodianAmount", shift, Math.round(autoHandover));
  }
  const actualHandover = nS("custodianAmount", shift); // positive = custodian took cash out; negative = custodian topped the till up

  const handoverNote = document.getElementById("handoverVarianceNote_" + shift);
  const handoverDiff = Math.round(actualHandover - autoHandover);
  if (Math.abs(handoverDiff) > 1) {
    handoverNote.style.color = "var(--danger)";
    handoverNote.textContent = `Off by PKR ${Math.abs(handoverDiff).toLocaleString()} vs. the auto-generated amount — double check with the custodian before saving.`;
  } else {
    handoverNote.style.color = "var(--success)";
    handoverNote.textContent = "Matches the auto-generated amount.";
  }

  // What should physically be left in the till once the actual handover has been taken out.
  const expectedClosing = st.openingCashTill + cashSales - st.tillCashExpenses - actualHandover;
  const closingEntered = document.getElementById("closingCash_" + shift).value !== "";
  const closing = nS("closingCash", shift);
  const closingNote = document.getElementById("closingVarianceNote_" + shift);

  if (closingEntered) {
    const closingDiff = Math.round(closing - expectedClosing);
    if (Math.abs(closingDiff) > 1) {
      closingNote.style.color = "var(--danger)";
      closingNote.textContent = `Expected PKR ${Math.round(expectedClosing).toLocaleString()} left in the till after the handover — off by PKR ${Math.abs(closingDiff).toLocaleString()}. Worth a recount, but this won't block saving.`;
    } else {
      closingNote.style.color = "var(--success)";
      closingNote.textContent = `Matches the expected PKR ${Math.round(expectedClosing).toLocaleString()} left in the till.`;
    }
  } else {
    closingNote.style.color = "";
    closingNote.textContent = `Expected PKR ${Math.round(expectedClosing).toLocaleString()} left in the till once the handover above is taken out.`;
  }
}

// Combines both shifts live from whatever is currently in each shift's fields — this is
// the whole-day figure the director cares about, not either shift in isolation.
function recalcTotals(){
  let covers = 0, sale = 0, cashSales = 0, cashExpenses = 0, handover = 0;
  ["morning","evening"].forEach(s => {
    covers += Math.round(nS("diCovers",s) + nS("taCovers",s) + nS("dlCovers",s) + nS("tpCovers",s) + nS("fpCovers",s));
    sale += nS("diAmount",s) + nS("taAmount",s) + nS("dlAmount",s) + nS("tpAmount",s) + nS("fpAmount",s);
    cashSales += cashSalesTotal(s);
    cashExpenses += state[s].tillCashExpenses;
    handover += nS("custodianAmount", s);
  });
  document.getElementById("totalCovers").textContent = covers.toLocaleString();
  document.getElementById("totalSale").textContent = "PKR " + Math.round(sale).toLocaleString();
  document.getElementById("totalCashSales").textContent = "PKR " + Math.round(cashSales).toLocaleString();
  document.getElementById("totalCashExpenses").textContent = "PKR " + Math.round(cashExpenses).toLocaleString();
  document.getElementById("totalHandover").textContent = "PKR " + Math.round(handover).toLocaleString();

  const summaryEl = document.getElementById("shiftStatusSummary");
  if (summaryEl) {
    summaryEl.innerHTML = ["morning","evening"].map(s =>
      `${SHIFT_LABELS[s]}: <strong>${state[s].status === "closed" ? "Closed — locked" : "Draft"}</strong>`
    ).join(" &middot; ");
  }
}

function applyLockUI(shift){
  const closed = state[shift].status === "closed";
  const lockFields = FIELD_BASES.concat(["custodianAmount","closingCash"]);
  lockFields.forEach(base => { document.getElementById(fid(base, shift)).disabled = closed; });
  document.getElementById("saveBtn_" + shift).hidden = closed;
  document.getElementById("closeBtn_" + shift).hidden = closed;
  document.getElementById("unlockBtn_" + shift).hidden = !closed;
  const badge = document.getElementById("statusBadge_" + shift);
  badge.textContent = closed ? "Closed — locked" : "Draft";
  badge.className = "status-badge " + (closed ? "closed" : "draft");
  const note = document.getElementById("lockedNote_" + shift);
  note.hidden = !closed;
  if (closed) note.textContent = "This shift is closed and can't be edited. A director can unlock it below.";
}

// Shift Manager's own pending-tasks banner — reflects the same checklist the Owner
// Dashboard surfaces, scoped to this location, since there's no per-person login here.
async function loadTaskBanner(){
  const el = document.getElementById("taskBanner");
  if (!locationId) { el.className = "banner"; return; }
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/audit_alerts?location_id=eq.${locationId}&status=eq.open&alert_type=eq.task_shift_close_missing&select=title&order=title.asc`,
      { headers }
    );
    if (!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    if (!rows.length) { el.className = "banner"; return; }
    el.innerHTML = "<strong>Pending for Shift Manager:</strong> " + rows.map(r => r.title.replace("Shift not closed - ", "")).join(", ");
    el.className = "banner show danger";
  } catch (e) { el.className = "banner"; }
}

function todayStr() {
  // Gulberg's business day: before 9:00am PKT still counts as the previous
  // calendar day, since the restaurant runs past midnight and does not
  // really "end" until the early-morning close.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Karachi", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hour12: false
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t).value;
  let y = +get("year"), mo = +get("month"), d = +get("day"), hr = +get("hour");
  if (hr === 24) hr = 0;
  const dt = new Date(Date.UTC(y, mo - 1, d));
  if (hr < 9) dt.setUTCDate(dt.getUTCDate() - 1);
  return dt.toISOString().slice(0, 10);
}

async function init(){
  const dateInput = document.getElementById("dateInput");
  dateInput.value = todayStr();

  try {
    const locRes = await fetch(
      `${SUPABASE_URL}/rest/v1/locations?name=ilike.*${LOCATION_NAME_HINT}*&select=id,name&limit=1`,
      { headers }
    );
    if (!locRes.ok) throw new Error("locations " + locRes.status);
    const locs = await locRes.json();
    if (!locs.length) throw new Error("No location matching '" + LOCATION_NAME_HINT + "' found");
    locationId = locs[0].id;

    document.getElementById("continueBtn").disabled = false;
    loadTaskBanner();
  } catch (err) {
    showBanner("Could not load the location (" + err.message + "). You can still continue and save, but check Supabase RLS on 'locations' allows anon SELECT if this persists.", "danger");
    document.getElementById("continueBtn").disabled = false;
  }
}

// The real, recorded cash expenses for this shift — entered independently at the Daily
// Expense window, not derived from the till math. This is the "actual" figure the
// calculated (implied) figure gets compared against, and what the auto-suggested
// custodian handover is computed from.
// Excludes anything marked "Paid From: Safe 2" — that cash never came out of this shift's
// till in the first place (Zeeshan paid it directly out of Safe 2, e.g. a utility/govt
// bill), so it shouldn't reduce the custodian handover here; it shows up in Safe 2's
// Cash Out on the cash-reconciliation page instead. Changed 2026-10-13.
async function fetchTillCashExpenses(saleDate, shift){
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/expenses?location_id=eq.${locationId}&expense_date=eq.${saleDate}&shift=eq.${shift}&payment_method=eq.cash&paid_from_safe=neq.safe2&select=amount`,
      { headers }
    );
    if (!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    return rows.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
  } catch (e) {
    return 0;
  }
}

async function loadShiftEntry(shift){
  if (!locationId) return;
  const saleDate = document.getElementById("dateInput").value;
  const st = state[shift];

  let existing = null;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/daily_sales?location_id=eq.${locationId}&sale_date=eq.${saleDate}&shift=eq.${shift}` +
      `&select=id,dine_in_covers,dine_in_amount,takeaway_covers,takeaway_amount,delivery_covers,delivery_amount,third_party_covers,third_party_amount,food_panda_covers,food_panda_amount,bakery_sale,card_amount,total_sale,total_covers,opening_cash_till,closing_cash_till,custodian_cash_amount,status,closed_at`,
      { headers }
    );
    if (res.ok) {
      const rows = await res.json();
      if (rows.length) existing = rows[0];
    }
  } catch (e) { /* fall through */ }

  st.tillCashExpenses = await fetchTillCashExpenses(saleDate, shift);

  if (existing) {
    st.existingEntryId = existing.id;
    st.openingCashTill = Number(existing.opening_cash_till) || STANDARD_TILL_FLOAT;
    st.status = existing.status || "draft";
    setVal("diCovers", shift, existing.dine_in_covers || "");
    setVal("diAmount", shift, existing.dine_in_amount || "");
    setVal("taCovers", shift, existing.takeaway_covers || "");
    setVal("taAmount", shift, existing.takeaway_amount || "");
    setVal("dlCovers", shift, existing.delivery_covers || "");
    setVal("dlAmount", shift, existing.delivery_amount || "");
    setVal("tpCovers", shift, existing.third_party_covers || "");
    setVal("tpAmount", shift, existing.third_party_amount || "");
    setVal("fpCovers", shift, existing.food_panda_covers || "");
    setVal("fpAmount", shift, existing.food_panda_amount || "");
    setVal("bakeryAmount", shift, existing.bakery_sale || "");
    setVal("cardAmount", shift, existing.card_amount || "");
    // custodian_cash_amount is stored negative when cash left the till (the normal case) —
    // flip the sign back to "actual handover", where positive means cash went to the custodian.
    setVal("custodianAmount", shift, -(Number(existing.custodian_cash_amount) || 0));
    setVal("closingCash", shift, existing.closing_cash_till != null ? existing.closing_cash_till : "");
    st.custodianTouched = true; // this shift already has a real saved handover — don't clobber it with a fresh suggestion
  } else {
    st.existingEntryId = null;
    st.openingCashTill = STANDARD_TILL_FLOAT;
    st.status = "draft";
    FIELD_BASES.forEach(base => setVal(base, shift, ""));
    setVal("custodianAmount", shift, "");
    setVal("closingCash", shift, "");
    st.custodianTouched = false; // fresh shift — let the auto-suggestion fill the custodian handover
  }

  document.getElementById("openingCashDisplay_" + shift).value = "PKR " + Math.round(st.openingCashTill).toLocaleString();
  applyLockUI(shift);
  recalcSummary(shift);
}

function loadBothShifts(){
  loadShiftEntry("morning");
  loadShiftEntry("evening");
}

async function saveShift(shift, close){
  const whoId = resolvedUserId;
  if (!whoId){
    showBanner("Enter your code and PIN under \"Entered by\" before saving.", "danger");
    return;
  }
  if (close && document.getElementById(fid("closingCash", shift)).value === ""){
    alert("Enter the actual physical cash present in the till before closing this shift.");
    return;
  }

  const btn = document.getElementById((close ? "closeBtn_" : "saveBtn_") + shift);
  const prevText = btn.textContent;
  btn.disabled = true;
  btn.textContent = close ? "Closing…" : "Saving…";

  const saleDate = document.getElementById("dateInput").value;
  const dow = new Date(saleDate + "T00:00:00").toLocaleDateString("en-US", { weekday: "short" }).slice(0, 3);

  // Actual handover is positive when cash left the till (the normal case) — stored negative
  // in custodian_cash_amount to match the sign convention cash-reconciliation.html expects.
  const custodianSigned = -nS("custodianAmount", shift);
  const closingEntered = document.getElementById(fid("closingCash", shift)).value !== "";

  const payload = {
    location_id: locationId,
    sale_date: saleDate,
    shift: shift,
    day_of_week: dow,
    dine_in_covers: Math.round(nS("diCovers", shift)),
    dine_in_amount: nS("diAmount", shift),
    takeaway_covers: Math.round(nS("taCovers", shift)),
    takeaway_amount: nS("taAmount", shift),
    delivery_covers: Math.round(nS("dlCovers", shift)),
    delivery_amount: nS("dlAmount", shift),
    third_party_covers: Math.round(nS("tpCovers", shift)),
    third_party_amount: nS("tpAmount", shift),
    food_panda_covers: Math.round(nS("fpCovers", shift)),
    food_panda_amount: nS("fpAmount", shift),
    bakery_sale: nS("bakeryAmount", shift),
    card_amount: nS("cardAmount", shift),
    // opening_cash_till is NOT sent — the DB trigger (daily_sales_compute_opening_cash) always
    // sets it to the standard PKR 40,000 float on insert, and locks it on update.
    custodian_cash_amount: custodianSigned,
    closing_cash_till: closingEntered ? nS("closingCash", shift) : null,
    entered_by_user_id: whoId,
    entered_by_manager_id: resolvedManagerId,
  };
  if (close) {
    payload.status = "closed";
    payload.closed_at = new Date().toISOString();
    payload.closed_by_manager_id = resolvedManagerId;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/daily_sales?on_conflict=location_id,sale_date,shift`, {
      method: "POST",
      headers: { ...headers, "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(res.status + ": " + errText.slice(0, 200));
    }
    showBanner((close ? "Closed — " : "Saved — ") + SHIFT_LABELS[shift] + " shift, " + saleDate + "." + (close ? " Only a director can reopen it now." : " You can keep adding to this same entry."), "success");
    await loadShiftEntry(shift);
  } catch (err) {
    showBanner("Could not save: " + err.message, "danger");
  } finally {
    btn.disabled = false;
    btn.textContent = prevText;
  }
}

async function unlockShift(shift){
  const pin = prompt("Director PIN to unlock the " + SHIFT_LABELS[shift] + " shift:");
  if (!pin) return;
  const saleDate = document.getElementById("dateInput").value;
  try {
    await sbRpc("admin_unlock_shift_v1", { p_owner_pin: pin, p_location_id: locationId, p_sale_date: saleDate, p_shift: shift });
    showBanner(SHIFT_LABELS[shift] + " shift unlocked — it can be edited again.", "success");
    await loadShiftEntry(shift);
  } catch (e) {
    showBanner("Could not unlock: " + e.message, "danger");
  }
}

function afterLogin(userId, name, managerId, role) {
  resolvedUserId = userId;
  resolvedManagerId = managerId;
  document.getElementById("whoCard").hidden = true;
  document.getElementById("shiftsContainer").hidden = false;
  hideBanner();
  loadBothShifts();
}

buildPanels();

document.getElementById("continueBtn").addEventListener("click", async () => {
  const nameInput = document.getElementById("loginName");
  const pinInput = document.getElementById("loginPin");
  const errEl = document.getElementById("login-error");
  const typedCode = nameInput.value.trim().toUpperCase();
  const pin = pinInput.value;
  errEl.hidden = true;
  if (!typedCode || !pin){
    showBanner("Enter your code and PIN under \"Entered by\" before continuing.", "danger");
    return;
  }
  const btn = document.getElementById("continueBtn");
  btn.disabled = true;
  try {
    const managers = await sbRpc("list_managers_for_page_with_code_v2", { p_page_key: PAGE_KEY });
    const match = managers.find(m => m.login_code === typedCode);
    if (!match) throw new Error("no match");
    const rows = await sbRpc("verify_manager_pin", { p_manager_id: match.id, p_pin: pin });
    const row = rows && rows[0];
    if (!row) throw new Error("no match");
    FNKSession.set({ managerId: match.id, userId: row.app_user_id, userName: match.name, role: row.role, pages: [PAGE_KEY], viewOnlyPages: match.view_only ? [PAGE_KEY] : [], loginAt: new Date().toISOString() });
    afterLogin(row.app_user_id, match.name, match.id, row.role);
    FNKSession.applyAccessLock(FNKSession.get(), PAGE_KEY);
  } catch (e) {
    errEl.hidden = false;
    pinInput.value = "";
    pinInput.focus();
  } finally {
    btn.disabled = false;
  }
});
document.getElementById("dateInput").addEventListener("change", loadBothShifts);

init().then(() => {
  const existing = FNKSession.get();
  if (existing && FNKSession.hasAccess(existing, PAGE_KEY)) {
    afterLogin(existing.userId, existing.userName, existing.managerId, existing.role);
    FNKSession.applyAccessLock(existing, PAGE_KEY);
  }
});
</script>
