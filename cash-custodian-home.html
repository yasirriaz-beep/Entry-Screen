<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Custodian — Gulberg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --border: #e4ddd1; --ink: #2a2420; --ink-soft: #6f655a;
    --accent: #9c3b2e; --accent-ink: #ffffff; --field-bg: #fcfaf6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1815; --surface: #262220; --border: #3a342f; --ink: #f1ece4; --ink-soft: #ad9f90;
      --accent: #e0775f; --accent-ink: #1c1815; --field-bg: #201c19;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1815; --surface: #262220; --border: #3a342f; --ink: #f1ece4; --ink-soft: #ad9f90;
    --accent: #e0775f; --accent-ink: #1c1815; --field-bg: #201c19;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Libre Franklin', system-ui, sans-serif; padding: 20px 16px 48px; max-width: 480px; margin: 0 auto; }
  h1 { font-family: 'Zilla Slab', Georgia, serif; font-size: 1.4rem; margin: 4px 0 2px; }
  .sub { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 20px; }
  a.link-btn { display: block; background: var(--accent); color: var(--accent-ink); text-decoration: none; padding: 14px 18px; border-radius: 10px; margin-top: 14px; font-weight: 600; text-align: center; }
  a.switch-link { display: block; text-align: center; margin-top: 28px; color: var(--ink-soft); font-size: 0.85rem; text-decoration: underline; }
</style>
</head>
<body>

<h1 id="page-title">Cash Custodian</h1>
<div class="sub">Your daily tasks at Gulberg.</div>

<a class="link-btn" href="vendor-payment.html">Vendor Payments</a>
<a class="link-btn" href="pos-upload.html">Upload POS Sold Report</a>
<a class="link-btn" href="settlements.html">Settlements (Food Panda / Card)</a>
<a class="link-btn" href="payroll-entry.html">Payroll</a>

<a class="switch-link" href="role-select.html">Switch Person</a>

<script>
(function () {
  let user = null;
  try { user = JSON.parse(localStorage.getItem("fnk_user") || "null"); } catch (e) { user = null; }
  if (!user || !user.role) {
    location.href = "role-select.html";
    return;
  }
  // Soft UX guard only (not security — Postgres RLS enforces the real rule). Directors may
  // peek at any role-home page without being bounced.
  if (user.role !== "cash_custodian" && user.role !== "director") {
    location.href = "role-select.html";
    return;
  }
  document.getElementById("page-title").textContent = "Cash Custodian — " + user.name;
})();
</script>

</body>
</html>
